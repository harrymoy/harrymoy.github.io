# Site settings
title: Harry Moy
email: harrymoy@me.com
description: >-
  Notes on engineering, books and London.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://harrymoy.com"
markdown: GFM

author:
  name: Harry Moy
  twitter: HarryMoy
timezone: Europe/London

# jekyll-seo-tag
twitter:
  username: HarryMoy
  card: summary_large_image
social:
  name: Harry Moy
  links:
    - https://x.com/harrymoy
    - https://github.com/HarryMoy
logo: /images/android-chrome-512x512.png

twitter_username: HarryMoy
github_username: HarryMoy

collections:
  books:
    output: true

defaults:
  # Default social sharing card. Any page or post may override with its own `image`.
  - scope:
      path: ""
    values:
      layout: "default"
      image: /images/og.png
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
