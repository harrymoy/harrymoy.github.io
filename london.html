<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preload" href="https://tiles.openfreemap.org/styles/positron" as="fetch" crossorigin>

<article class="page">
  <h1>London</h1>
  <p class="page-lede">London is the best city in the world. And here are some of my favourite places.</p>

  {% include london-skyline.html %}

  <div class="london-map" id="london-map" aria-label="Map of my favourite places in London"></div>

  <ul class="visually-hidden">
    {%- for place in site.data.london %}
    <li>{{ place.name }} ({{ place.type }}), {{ place.area }}</li>
    {%- endfor %}
  </ul>
</article>

<script>window.LONDON_PLACES = {{ site.data.london | jsonify }};</script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" defer></script>
